[Repositories]
DocumentsRepository=
PolicyRepository=
PolicySetsRepository=
CustomerVariablesRepository=
ScriptsRepository=
AutoDiscover=true
ScanOnStartup=false
WatchForChanges=false
ValidateOnScan=true

[Repositories.Json]
IncludeSubdirectories=true
FilePattern=*.json
AllowComments=false
DetectDuplicateIdentifiers=true
PreserveUnknownProperties=true

[Repositories.PowerShell]
IncludeSubdirectories=true
FilePattern=*.ps1
AnalyzeCompanionFiles=true
ExecuteDuringScan=false
