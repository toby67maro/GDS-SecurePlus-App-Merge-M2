; Secure Plus Agent (Global Data Systems) application configuration.
; Precedence (lowest to highest): compiled defaults, Application.ini, Branding.ini, Features.ini, Navigation.ini,
; Repositories.ini, Integrations.ini, Database.ini, Logging.ini, GoldenTenant.ini, Environments/{Environment}.ini,
; Workspace.ini, Customer.ini, Overrides.ini, ENGINEERINGWORKSPACE_* environment variables, command line.
; See docs/configuration/application-ini-reference.md. Never put secrets in configuration files.

[Application]
Id=SecurePlus.ModernWork
Name=Secure Plus Agent
Title=Secure Plus Agent
CompanyName=Global Data Systems
Environment=Development
DefaultRoute=dashboard/overview
RestoreLastWorkspace=true
AllowMultipleInstances=false

; Relative paths resolve against %LOCALAPPDATA%\Global Data Systems\Secure Plus Agent.
; AssetDirectory resolves against the application directory.
[Paths]
ConfigurationDirectory=./config
DataDirectory=./data
WorkspaceDirectory=./data/Workspaces
CustomerDirectory=./data/Customers
GoldenTenantDirectory=./data/GoldenTenants
ImportDirectory=./data/Imports
ExportDirectory=./data/Exports
LogDirectory=./data/Logs
AuditDirectory=./data/Audit
AssetDirectory=./assets
CredentialDirectory=./data/Credentials
StateDirectory=./data/State

[Workspace]
RequireWorkspace=false
CreateDirectoryIfMissing=true
RestoreLastWorkspace=true
AllowCustomerlessWorkspace=true
DefaultWorkspace=

; Secrets are never exportable; there is intentionally no setting to include them.
[ImportExport]
DefaultExportFormat=Json
OverwriteExistingFiles=false
IncludeMetadata=true
TimestampFileNames=true

[Credentials]
ExpirationWarningDays=30
SecretStoreProvider=Dpapi
