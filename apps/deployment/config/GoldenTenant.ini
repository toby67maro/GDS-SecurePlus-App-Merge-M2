; Golden Tenant baseline: the policy sets of the Secure Plus control catalog that every customer tenant is compared
; with (Workspace > Settings > Golden Tenant Configuration edits this file). PolicySets is a comma-separated list of
; catalog policy set IDs; the default Golden-Tenant set composes 00-Foundation to 08-Endpoint-Attack-Surface-Reduction.
; ReferenceCustomerId optionally names the customer whose tenant is the reference (golden) tenant.

[GoldenTenant]
Enabled=true
BaselineId=Golden-Tenant
PolicySets=Golden-Tenant
ReferenceCustomerId=
ConditionalAccessBaselineRepository=
PolicySetsDirectory=
