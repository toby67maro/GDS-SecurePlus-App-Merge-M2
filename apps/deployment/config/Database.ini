; Non-secret database settings. Written by Workspace > Settings > Database Configuration to the per-user copy of
; this file (%LOCALAPPDATA%\Global Data Systems\Secure Plus Agent\config\Database.ini).
; Provider: None | SQLite | SqlServer | AzureSql   (EaaS v3 specifies SQL Server 2022 / Azure SQL; SQLite is a
; Secure Plus extension for local development).
; Authentication: WindowsIntegrated | SqlLogin | EntraInteractive | EntraServicePrincipal | EntraManagedIdentity | None
; Passwords and client secrets are stored with Credential Management; only their references belong here.
; Automatic initialization/upgrade are off by default and never honoured in Production.

[Database]
Provider=None
ServerName=
SqlInstance=
Port=
DatabaseName=
Authentication=None
UserName=
PasswordSecretReference=
EntraClientId=
EntraTenantId=
EntraClientSecretReference=
ManagedIdentityClientId=
EncryptConnection=true
TrustServerCertificate=false
ConnectionTimeoutSeconds=30
CommandTimeoutSeconds=60
RetryCount=3
RetryDelaySeconds=10
ConnectionStringSecretReference=
AutomaticDatabaseInitialization=false
AutomaticSchemaUpgrade=false
