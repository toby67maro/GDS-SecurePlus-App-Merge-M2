; NavigationVersion=3
; Configuration-driven navigation. Collections merge by stable ID across layers (MergeById): a higher layer
; (environment, workspace, customer, overrides) can change DisplayName, SortOrder, IsVisible, IsEnabled, Parent or
; RequiredFeature of an existing ID, add a new item, or remove one with Removed=true (RemoveById).
; Routes are stable and must be registered by the application; display names and order can change freely.
; Keys: DisplayName, Description, IconKey, SortOrder, IsVisible, IsEnabled, RequiredFeature, Parent,
;   sections: ExpandedByDefault, CanCollapse; groups: ExpandedByDefault, ShowHeader;
;   items: Route, IsDefault, RequiresWorkspace, RequiresCustomer, RequiredCapability; any node: RequiresAdvancedMode
;   (shown only after Advanced Mode is unlocked in Settings > Application Settings).
; Every section starts collapsed when the application launches; sections pinned open stay open.

