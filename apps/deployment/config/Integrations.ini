; Integration settings. Teams and ConnectWise API calls arrive in M8; enabling their features requires Enabled=true.
; Never put API keys or secrets here: store them in Credential Management and use *Reference keys.

[Integrations:Teams]
Enabled=false

[Integrations:ConnectWise]
Enabled=false
Site=
CompanyId=

; Create / Configure App Registration assistant: client ID of a public-client app registration (in the customer's
; tenant or a multi-tenant one) that an administrator signs in with. Leave empty to disable the assistant.
[Integrations:Microsoft]
AdministratorClientId=
AdministratorRedirectUri=http://localhost
